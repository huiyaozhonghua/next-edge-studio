name: Build and Push Next Edge Studio image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # runner 跑在 GitHub 服务器上，不受本地网络对 ghcr.io 的封锁影响
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # 推送到 GHCR 所需

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version tag
        id: meta
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${SHA}"
          fi
          echo "sha=${SHA}"      >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            PIPER_MODEL_URL=https://huggingface.co/rhasspy/piper-voices/resolve/main/zh/zh_CN/huayan/medium/zh_CN-huayan-medium.onnx
            PIPER_CONFIG_URL=https://huggingface.co/rhasspy/piper-voices/resolve/main/zh/zh_CN/huayan/medium/zh_CN-huayan-medium.onnx.json
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set package visibility to public
        # GHCR 新包默认 private；SoloHost 用户必须能匿名 pull，否则装不了
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/${IMAGE_NAME##*/} \
            -f visibility=public 2>/dev/null || \
          echo "⚠️ 自动改可见性失败，请手动设置："
          echo "   https://github.com/users/${GITHUB_ACTOR}/packages → $IMAGE_NAME → Package settings → Danger Zone → Public"

      - name: Verify package is publicly pullable
        # Docker 的真实拉取流程：先匿名取 pull token，再用 token 取 manifest。
        # 只测 manifest 会误判 —— manifest 接口本身要求带 token。
        env:
          IMAGE_NAME: ${{ github.repository }}
        run: |
          set -uo pipefail
          PKG="${IMAGE_NAME##*/}"
          OWNER="${IMAGE_NAME%%/*}"

          echo "--- package metadata ---"
          gh api "/users/${OWNER}/packages/container/${PKG}" \
            --jq '"name: \(.name)\nvisibility: \(.visibility)\ntype: \(.package_type)"' 2>&1 || true

          echo "--- anonymous pull flow (same as docker pull) ---"
          PULL_TOKEN=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/${PKG}:pull" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
          if [ -z "$PULL_TOKEN" ]; then
            echo "  ❌ 匿名取 pull token 失败 —— 包未开放匿名拉取"
            echo "     https://github.com/users/${OWNER}/packages → ${PKG} → Package settings → Danger Zone → Public"
            exit 1
          fi
          echo "  ✅ 匿名取到 pull token (len=${#PULL_TOKEN})"

          ACCEPT="application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json"
          CODE=$(curl -s -o /tmp/manifest.json -w '%{http_code}' \
            -H "Authorization: Bearer ${PULL_TOKEN}" \
            -H "Accept: ${ACCEPT}" \
            "https://ghcr.io/v2/${OWNER}/${PKG}/manifests/latest")
          echo "  manifest(latest) -> HTTP ${CODE}"

          echo "--- available tags ---"
          curl -s -H "Authorization: Bearer ${PULL_TOKEN}" -H "Accept: ${ACCEPT}" \
            "https://ghcr.io/v2/${OWNER}/${PKG}/tags/list" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('  tags:', ', '.join(d.get('tags') or ['(空)']))" 2>/dev/null || echo "  (取不到)"

          echo "--- docker pull without login ---"
          docker logout ghcr.io 2>/dev/null || true
          docker pull "ghcr.io/${OWNER}/${PKG}:latest" 2>&1 | tail -2

          echo "--- verdict ---"
          if [ "${CODE}" = "200" ]; then
            echo "  ✅ 匿名可拉 —— 任何 Pi 节点用户都能安装"
            echo "  ✅ 镜像地址: ghcr.io/${OWNER}/${PKG}:latest"
          else
            echo "  ❌ 匿名拉取失败 (HTTP ${CODE})"
            exit 1
          fi

# ─────────────────────────────────────────────────────────────
# Docker Hub 备用通道说明
#
# 为什么不放在本文件里用 `if: ${{ secrets.DOCKERHUB_USERNAME != '' }}` 判断？
#   因为 secrets.* 上下文在 **workflow 定义阶段** 求值 —— 当该 secret 尚未创建时，
#   求值失败会让整个 workflow 解析失败（表现为 GitHub 把 workflow 的 name
#   回退成文件路径，且 workflow_dispatch 报 422 "does not have trigger"）。
#   已实测确认：把 if: 里的 secrets.* 换成 github.* 即可正常解析。
#
# 正确做法：用独立的 dockerhub.yml，通过手动触发（workflow_dispatch）触发，
#         token 存在时自然成功；不存在时 docker/login-action 会明确报错。
#         推送到 Docker Hub: bash publish_studio.sh --hub
# ─────────────────────────────────────────────────────────────
