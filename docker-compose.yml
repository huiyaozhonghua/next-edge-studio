services:
  web:
    image: ghcr.io/huiyaozhonghua/next-edge-studio:1.0.0
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:18790:8080"
    environment:
      DATA_DIR: "/data"
      PORT: "8080"
      TTS_ENGINE: '${TTS_ENGINE}'
      PIPER_VOICE: '${PIPER_VOICE}'
      PIPER_MODEL_DIR: "/models"
      EDGE_VOICE: '${EDGE_VOICE}'
      SUBTITLE_STYLE: '${SUBTITLE_STYLE}'
    volumes:
      - studio_data:/data
    depends_on:
      - worker

  worker:
    image: ghcr.io/huiyaozhonghua/next-edge-studio:1.0.0
    restart: unless-stopped
    command: ["python3", "/app/worker.py"]
    environment:
      DATA_DIR: "/data"
      TTS_ENGINE: '${TTS_ENGINE}'
      PIPER_VOICE: '${PIPER_VOICE}'
      PIPER_MODEL_DIR: "/models"
      EDGE_VOICE: '${EDGE_VOICE}'
    volumes:
      - studio_data:/data

volumes:
  studio_data:
